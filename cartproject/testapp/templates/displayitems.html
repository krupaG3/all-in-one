<!DOCTYPE html>
{% extends "base.html" %}
{% block body_block %}
    <h1>your shopping cart items information </h1>
    <hr>
    {% if request.session %}
    <table>
      <thead>
        <th>Name of item</th>
        <th>Quantity</th>
      </thead>
      {% for key,value in request.session.items %}
      
      <tr>
        <td>{{key}}</td>
        <td>{{value}}</td>
        
      </tr>
      {% endfor %}
      </table>
      {% else %}
      <p>No items in shopping cart</p>
    {% endif %}
    

{% endblock  %}
